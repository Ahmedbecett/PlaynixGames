<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090B14">
<title>Astro Dodge</title>
<style>
  :root{--bg:#090B14;--card:#171E30;--accent:#FF7A18;--cyan:#22D3EE;--violet:#8B5CF6;--text:#F8FAFC;--muted:#A1AABD}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  header b{color:var(--text)}
  #stage{flex:1;position:relative;display:grid;place-items:center;padding:6px}
  canvas{touch-action:none;border-radius:16px;box-shadow:0 0 0 1px rgba(139,92,246,.25),0 18px 50px rgba(0,0,0,.6);background:#080a12}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,11,20,.85);backdrop-filter:blur(6px)}
  .panel{max-width:330px;text-align:center;padding:24px 22px;border-radius:22px;background:var(--card);border:1px solid rgba(34,211,238,.25)}
  .panel h1{margin:0 0 8px;font-size:23px;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}
  .panel button{width:100%;padding:13px;border:0;border-radius:14px;font-weight:700;color:#0b0f18;background:linear-gradient(135deg,var(--accent),#ffb35c)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <header><span>Score <b id="score">0</b></span><span>Wave <b id="wave">1</b></span><span>Shield <b id="shield">100%</b></span></header>
  <div id="stage">
    <canvas id="game" width="420" height="640"></canvas>
    <div id="overlay"><div class="panel">
      <h1>Astro Dodge</h1>
      <p>Drag to fly, tap to fire. Dodge the storm, break the rocks, keep the shield alive.</p>
      <button id="startBtn">Launch ship</button>
    </div></div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const waveEl = document.getElementById("wave");
  const shieldEl = document.getElementById("shield");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");

  const W = 420, H = 640;
  let ship, rocks, bullets, particles, stars, score, shield, wave, running, paused, elapsed, spawnTimer, fireTimer, keys, touchTarget;

  function resize() {
    const stage = canvas.parentElement;
    const maxW = stage.clientWidth - 12, maxH = stage.clientHeight - 12;
    const ratio = W / H;
    let width = Math.min(maxW, maxH * ratio), height = width / ratio;
    if (height > maxH) { height = maxH; width = height * ratio; }
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.width / W, 0, 0);
    draw();
  }

  function makeStars() {
    stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 1.6 + 0.35 }));
  }

  function reset() {
    ship = { x: W / 2, y: H - 90, r: 13, vx: 0, vy: 0 };
    rocks = []; bullets = []; particles = [];
    score = 0; shield = 100; wave = 1; elapsed = 0; spawnTimer = 0; fireTimer = 0;
    keys = {}; touchTarget = null;
    makeStars();
    scoreEl.textContent = "0"; waveEl.textContent = "1"; shieldEl.textContent = "100%";
  }

  function start() {
    reset(); running = true; paused = false;
    overlay.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    overlay.classList.remove("hidden");
    overlay.querySelector("h1").textContent = "Ship lost";
    overlay.querySelector("p").textContent = `Score ${score} · wave ${wave}. The storm keeps coming — jump back in?`;
    startBtn.textContent = "Fly again";
  }

  function spawnRock() {
    const radius = 12 + Math.random() * 22;
    rocks.push({
      x: Math.random() * (W - radius * 2) + radius,
      y: -radius - 10,
      r: radius,
      vx: (Math.random() - 0.5) * 60,
      vy: 55 + Math.random() * 40 + wave * 9,
      hp: Math.ceil(radius / 16),
      spin: (Math.random() - 0.5) * 2,
      angle: 0,
    });
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, life: 1, color });
    }
  }

  function fire() {
    if (fireTimer > 0) return;
    fireTimer = 0.16;
    bullets.push({ x: ship.x, y: ship.y - 16, vy: -620 });
  }

  function hitShip(damage) {
    shield -= damage;
    if (shield <= 0) { shield = 0; shieldEl.textContent = "0%"; burst(ship.x, ship.y, "#FF7A18", 40); gameOver(); }
    else shieldEl.textContent = Math.round(shield) + "%";
  }

  function update(dt) {
    elapsed += dt;
    wave = 1 + Math.floor(elapsed / 22);
    waveEl.textContent = String(wave);

    // ship movement
    const accel = 900, friction = 0.86;
    if (keys.ArrowLeft || keys.KeyA) ship.vx -= accel * dt;
    if (keys.ArrowRight || keys.KeyD) ship.vx += accel * dt;
    if (keys.ArrowUp || keys.KeyW) ship.vy -= accel * dt;
    if (keys.ArrowDown || keys.KeyS) ship.vy += accel * dt;
    if (touchTarget) {
      ship.vx += Math.max(-1, Math.min(1, (touchTarget.x - ship.x) / 40)) * accel * dt;
      ship.vy += Math.max(-1, Math.min(1, (touchTarget.y - ship.y) / 40)) * accel * dt;
    }
    ship.vx *= friction; ship.vy *= friction;
    ship.x = Math.max(20, Math.min(W - 20, ship.x + ship.vx * dt));
    ship.y = Math.max(60, Math.min(H - 30, ship.y + ship.vy * dt));

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = Math.max(0.22, 0.85 - wave * 0.06);
      spawnRock();
    }

    fireTimer = Math.max(0, fireTimer - dt);

    // rocks
    for (const rock of rocks) {
      rock.x += rock.vx * dt;
      rock.y += rock.vy * dt;
      rock.angle += rock.spin * dt;
      if (rock.x <-rock.r) rock.x = W + rock.r;
      if (rock.x > W + rock.r) rock.x = -rock.r;
      const dist = Math.hypot(rock.x - ship.x, rock.y - ship.y);
      if (dist < rock.r + ship.r - 3) {
        hitShip(18 + rock.r * 0.4);
        rock.hp = 0;
        burst(rock.x, rock.y, "#8B5CF6", 18);
        if (!running) return;
      }
      if (rock.y > H + 60) rock.hp = -1;
    }
    rocks = rocks.filter((rock) => rock.hp > 0);

    // bullets
    for (const bullet of bullets) {
      bullet.y += bullet.vy * dt;
      for (const rock of rocks) {
        if (Math.hypot(rock.x - bullet.x, rock.y - bullet.y) < rock.r) {
          rock.hp -= 1; bullet.y = -100;
          burst(bullet.x, bullet.y + 20, "#22D3EE", 6);
          if (rock.hp <= 0) {
            score += Math.round(rock.r);
            scoreEl.textContent = String(score);
            burst(rock.x, rock.y, "#FF7A18", 14);
          }
          break;
        }
      }
    }
    bullets = bullets.filter((b) => b.y > -20);

    // shield slowly recovers
    if (shield < 100 && running) {
      shield = Math.min(100, shield + dt * 1.6);
      shieldEl.textContent = Math.round(shield) + "%";
    }

    particles = particles.filter((p) => p.life > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.8; }
    for (const star of stars) { star.y += (12 + star.z * 26) * dt; if (star.y > H) { star.y = -2; star.x = Math.random() * W; } }
  }

  function draw() {
    if (!ctx || !ship) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#080a12"; ctx.fillRect(0, 0, W, H);
    for (const star of stars || []) {
      ctx.globalAlpha = 0.15 + star.z * 0.35;
      ctx.fillStyle = "#A1AABD";
      ctx.fillRect(star.x, star.y, star.z * 1.6, star.z * 1.6);
    }
    ctx.globalAlpha = 1;

    for (const rock of rocks) {
      ctx.save(); ctx.translate(rock.x, rock.y); ctx.rotate(rock.angle);
      ctx.strokeStyle = "#8B5CF6"; ctx.lineWidth = 2;
      ctx.fillStyle = "rgba(139,92,246,.18)";
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        const rr = rock.r * (0.78 + ((i * 37) % 10) / 28);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = "#22D3EE";
    for (const bullet of bullets) ctx.fillRect(bullet.x - 1.5, bullet.y - 10, 3, 12);

    // ship
    ctx.save(); ctx.translate(ship.x, ship.y);
    ctx.fillStyle = "#F8FAFC";
    ctx.shadowColor = "#22D3EE"; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(11, 12); ctx.lineTo(0, 6); ctx.lineTo(-11, 12); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#FF7A18";
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(5, 15); ctx.lineTo(0, 11); ctx.lineTo(-5, 15); ctx.closePath(); ctx.fill();
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    // shield bar
    ctx.fillStyle = "rgba(161,170,189,.18)";
    ctx.fillRect(16, H - 22, W - 32, 6);
    ctx.fillStyle = shield > 45 ? "#22C55E" : shield > 20 ? "#FF7A18" : "#EF4444";
    ctx.fillRect(16, H - 22, (W - 32) * (shield / 100), 6);

    if (paused && running) {
      ctx.fillStyle = "rgba(9,11,20,.7)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#F8FAFC"; ctx.font = "600 20px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText("Paused", W / 2, H / 2);
    }
  }

  let last = 0;
  function loop(now) {
    if (!running) { draw(); return; }
    const dt = Math.min((now - last) / 1000 || 0, 0.05);
    last = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function pointerToGame(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: ((clientX - rect.left) / rect.width) * W, y: ((clientY - rect.top) / rect.height) * H };
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    touchTarget = pointerToGame(e.clientX, e.clientY);
    if (running) fire();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" && e.buttons === 0 && !touchTarget) return;
    if (e.buttons || e.pointerType === "touch") touchTarget = pointerToGame(e.clientX, e.clientY);
  });
  canvas.addEventListener("pointerup", () => { touchTarget = null; });
  canvas.addEventListener("pointercancel", () => { touchTarget = null; });

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
    if (e.code === "Space" && running) fire();
    if (e.code === "Escape" || e.code === "KeyP") { paused = !paused; last = performance.now(); draw(); }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) { paused = true; draw(); } });
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "playnix:pause" && running) { paused = true; draw(); }
    if (e.data && e.data.type === "playnix:resume" && running) { paused = false; last = performance.now(); }
  });
  window.addEventListener("resize", resize);

  reset(); running = false; resize();
  startBtn.addEventListener("click", () => { last = performance.now(); start(); });
})();
</script>
</body>
</html>
