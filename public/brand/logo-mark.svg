  <rect x="6" y="6" width="116" height="116" rx="31" fill="#111626"/>
  <rect x="6" y="6" width="116" height="116" rx="31" fill="none" stroke="url(#pn-shell)" stroke-width="3" opacity="0.85"/>

  <g filter="url(#pn-glow)">
    <path d="M39 31c3.4 0 6 2.6 6 6v54c0 3.4-2.6 6-6 6s-6-2.6-6-6V37c0-3.4 2.6-6 6-6z" fill="url(#pn-bar)"/>
    <path d="M55 40.5c0-4.6 5-7.4 8.9-5.1l30.4 18.2c3.8 2.3 3.8 7.9 0 10.2L63.9 82c-3.9 2.3-8.9-.5-8.9-5.1z" fill="url(#pn-play)"/>
  </g>

  <circle cx="97" cy="95" r="5.5" fill="#FF7A18" opacity="0.9"/>
  <circle cx="27" cy="96" r="3.2" fill="#22D3EE" opacity="0.75"/>
