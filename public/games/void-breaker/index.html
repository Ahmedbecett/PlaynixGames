<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090B14">
<title>Void Breaker</title>
<style>
  :root{--bg:#090B14;--card:#171E30;--accent:#FF7A18;--cyan:#22D3EE;--violet:#8B5CF6;--text:#F8FAFC;--muted:#A1AABD}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  header b{color:var(--text)}
  #stage{flex:1;position:relative;display:grid;place-items:center;padding:6px}
  canvas{touch-action:none;border-radius:16px;box-shadow:0 0 0 1px rgba(139,92,246,.25),0 18px 50px rgba(0,0,0,.6);background:#0b0f1a}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,11,20,.85);backdrop-filter:blur(6px)}
  .panel{max-width:320px;text-align:center;padding:24px 22px;border-radius:22px;background:var(--card);border:1px solid rgba(34,211,238,.25)}
  .panel h1{margin:0 0 8px;font-size:23px;background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}
  .panel button{width:100%;padding:13px;border:0;border-radius:14px;font-weight:700;color:#0b0f18;background:linear-gradient(135deg,var(--accent),#ffb35c)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <header><span>Score <b id="score">0</b></span><span>Level <b id="level">1</b></span><span>Lives <b id="lives">3</b></span></header>
  <div id="stage">
    <canvas id="game" width="420" height="640"></canvas>
    <div id="overlay"><div class="panel">
      <h1>Void Breaker</h1>
      <p>Drag anywhere to move the paddle. Clear every crystal to advance. Three lives per run.</p>
      <button id="startBtn">Launch ball</button>
    </div></div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const livesEl = document.getElementById("lives");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");

  const W = 420, H = 640;
  let cssW = W, cssH = H, scale = 1;
  let paddle, ball, bricks, score, lives, level, running, launched, paused;
  const COLS = 8, ROWS = 5, PAD_H = 12, BRICK_H = 22;

  function resize() {
    const stage = canvas.parentElement;
    const maxW = stage.clientWidth - 12;
    const maxH = stage.clientHeight - 12;
    const ratio = W / H;
    let width = Math.min(maxW, maxH * ratio);
    let height = width / ratio;
    if (height > maxH) { height = maxH; width = height * ratio; }
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    scale = canvas.width / W;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    cssW = W; cssH = H;
    draw();
  }

  function buildLevel(n) {
    bricks = [];
    const padding = 18, gap = 6;
    const bw = (W - padding * 2 - gap * (COLS - 1)) / COLS;
    const rows = Math.min(ROWS + Math.floor((n - 1) / 2), 8);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        bricks.push({ x: padding + c * (bw + gap), y: 70 + r * (BRICK_H + gap), w: bw, h: BRICK_H, alive: true, hp: n > 2 && r < 1 ? 2 : 1, row: r });
      }
    }
  }

  function resetBall() {
    ball = { x: W / 2, y: H - 92, vx: 0, vy: 0, r: 8, speed: 5.2 };
    launched = false;
    paddle.x = W / 2 - paddle.w / 2;
  }

  function startGame() {
    score = 0; lives = 3; level = 1; paddle = { x: W / 2 - 46, y: H - 44, w: 92, h: PAD_H };
    buildLevel(1); resetBall();
    scoreEl.textContent = "0"; levelEl.textContent = "1"; livesEl.textContent = "3";
    running = true; paused = false; overlay.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  function launch() {
    if (launched) return;
    launched = true;
    const angle = (-Math.PI / 2) + (Math.random() * 0.7 - 0.35);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function nextLevel() {
    level += 1;
    if (level > 8) { finish(true); return; }
    levelEl.textContent = String(level);
    buildLevel(level);
    resetBall();
  }

  function finish(won) {
    running = false;
    overlay.classList.remove("hidden");
    overlay.querySelector("h1").textContent = won ? "Void cleared" : "Game over";
    overlay.querySelector("p").textContent = `Score ${score} · level ${level}. ${won ? "Every crystal broken." : "The void won this round."}`;
    startBtn.textContent = "Play again";
  }

  function loseLife() {
    lives -= 1;
    livesEl.textContent = String(lives);
    if (lives <= 0) finish(false); else resetBall();
  }

  function update() {
    if (!running || paused) return;
    if (launched) {
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x - ball.r < 4) { ball.x = 4 + ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W - 4) { ball.x = W - 4 - ball.r; ball.vx *= -1; }
      if (ball.y - ball.r < 4) { ball.y = 4 + ball.r; ball.vy *= -1; }
      if (ball.y - ball.r > H) { loseLife(); return; }

      // paddle collision
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const angle = (-Math.PI / 2) + hit * 1.05;
        ball.speed = Math.min(ball.speed + 0.06, 8.4);
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        ball.y = paddle.y - ball.r - 0.5;
      }

      // brick collision
      for (const brick of bricks) {
        if (!brick.alive) continue;
        if (ball.x + ball.r > brick.x && ball.x - ball.r < brick.x + brick.w &&
            ball.y + ball.r > brick.y && ball.y - ball.r < brick.y + brick.h) {
          const overlapX = Math.min(ball.x + ball.r - brick.x, brick.x + brick.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - brick.y, brick.y + brick.h - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
          brick.hp -= 1;
          if (brick.hp <= 0) {
            brick.alive = false;
            score += 10 * level;
            scoreEl.textContent = String(score);
          } else {
            score += 2;
            scoreEl.textContent = String(score);
          }
          break;
        }
      }
      if (bricks.every((b) => !b.alive)) nextLevel();
    } else {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
    }
  }

  function draw() {
    if (!ctx || !paddle) return;
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, "#0b0f1a"); grad.addColorStop(1, "#101528");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    bricks.forEach((brick) => {
      if (!brick.alive) return;
      const hue = 200 + brick.row * 18;
      ctx.fillStyle = brick.hp > 1 ? "#8B5CF6" : `hsl(${hue} 85% 62%)`;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(brick.x, brick.y, brick.w, brick.h, 6); else ctx.rect(brick.x, brick.y, brick.w, brick.h);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // paddle
    const pg = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    pg.addColorStop(0, "#22D3EE"); pg.addColorStop(1, "#FF7A18");
    ctx.fillStyle = pg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); else ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fill();

    // ball
    ctx.fillStyle = "#F8FAFC";
    ctx.shadowColor = "#22D3EE"; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (!launched && running) {
      ctx.fillStyle = "rgba(248,250,252,.75)";
      ctx.font = "600 14px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Tap or press space to launch", W / 2, H - 110);
    }
    if (paused && running) {
      ctx.fillStyle = "rgba(9,11,20,.65)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#F8FAFC"; ctx.font = "600 20px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText("Paused", W / 2, H / 2);
    }
  }

  function loop() {
    if (!running) { draw(); return; }
    update(); draw();
    requestAnimationFrame(loop);
  }

  function movePaddle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }

  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); movePaddle(e.clientX); launch(); });
  canvas.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "touch") movePaddle(e.clientX); });
  window.addEventListener("keydown", (e) => {
    if (!running) return;
    if (e.code === "ArrowLeft" || e.code === "KeyA") paddle.x = Math.max(0, paddle.x - 34);
    if (e.code === "ArrowRight" || e.code === "KeyD") paddle.x = Math.min(W - paddle.w, paddle.x + 34);
    if (e.code === "Space") { e.preventDefault(); if (!launched) launch(); else { paused = !paused; draw(); } }
    if (e.code === "Escape") { paused = !paused; draw(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) { paused = true; draw(); } });
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "playnix:pause" && running) { paused = true; draw(); }
    if (e.data && e.data.type === "playnix:resume" && running) paused = false;
  });
  window.addEventListener("resize", resize);

  paddle = { x: W / 2 - 46, y: H - 44, w: 92, h: PAD_H };
  bricks = []; resetBall(); running = false; resize();
  startBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
