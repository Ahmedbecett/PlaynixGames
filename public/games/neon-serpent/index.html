<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090B14">
<title>Neon Serpent</title>
<style>
  :root { --bg:#090B14; --card:#171E30; --accent:#FF7A18; --cyan:#22D3EE; --violet:#8B5CF6; --text:#F8FAFC; --muted:#A1AABD; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  header b { color:var(--text); font-variant-numeric:tabular-nums; }
  #stage { flex:1; position:relative; display:grid; place-items:center; padding:8px; }
  canvas { display:block; border-radius:18px; background:radial-gradient(circle at 50% 0%,#141b2e,#090B14 70%);
    box-shadow:0 0 0 1px rgba(139,92,246,.25),0 18px 60px rgba(0,0,0,.6); touch-action:none; }
  #pad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:8px; justify-content:center; padding:10px 10px 18px; }
  #pad button { border:1px solid rgba(139,92,246,.35); background:rgba(23,30,48,.9); color:var(--text); border-radius:14px; font-size:20px; }
  #pad button:active { background:rgba(255,122,24,.25); border-color:var(--accent); }
  #overlay { position:absolute; inset:0; display:grid; place-items:center; background:rgba(9,11,20,.82); backdrop-filter:blur(6px); }
  .panel { text-align:center; padding:26px 22px; border-radius:22px; background:var(--card); border:1px solid rgba(34,211,238,.25); max-width:320px; }
  .panel h1 { margin:0 0 6px; font-size:24px; background:linear-gradient(90deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .panel p { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 18px; }
  .panel button { width:100%; padding:13px; border:0; border-radius:14px; font-weight:700; font-size:15px; color:#0b0f18;
    background:linear-gradient(135deg,var(--accent),#ffb35c); box-shadow:0 10px 30px rgba(255,122,24,.35); }
  .hidden { display:none !important; }
  @media (min-width:700px) and (pointer:fine) { #pad { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <header><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Speed <b id="speed">1</b></span></header>
  <div id="stage">
    <canvas id="game" width="600" height="600" aria-label="Neon Serpent game board"></canvas>
    <div id="overlay">
      <div class="panel">
        <h1>Neon Serpent</h1>
        <p id="hint">Swipe or use the arrow keys to steer. Eat the orbs, avoid your own tail.</p>
        <button id="startBtn">Start game</button>
      </div>
    </div>
  </div>
  <div id="pad" aria-hidden="true">
    <span></span><button data-dir="up" aria-label="Up">▲</button><span></span>
    <button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button>
  </div>
</div>
<script src="./game.js"></script>
</body>
</html>
