name: Deploy to Vercel

# Production deploy on every push to main, and a preview deploy for every
# other branch and pull request. Nothing here needs a long-lived token in the
# repository: Vercel's own GitHub integration is the primary path, and this
# workflow covers the case where that integration is not wired up.
#
# To switch it on, add three repository secrets (Settings → Secrets and
# variables → Actions):
#   VERCEL_TOKEN       https://vercel.com/account/tokens
#   VERCEL_ORG_ID      team_YCGVFOkWo0Kktd4rv4UYfwVa
#   VERCEL_PROJECT_ID  prj_BgjOLS4Yb9jjrro5Xz713oQR31Ni
#
# Until they exist the job exits cleanly with a notice instead of failing red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for credentials
        id: creds
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to repository secrets to enable automatic deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
