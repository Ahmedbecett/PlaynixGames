<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090B14">
<title>Memory Matrix</title>
<style>
  :root{--bg:#090B14;--card:#171E30;--accent:#FF7A18;--cyan:#22D3EE;--violet:#8B5CF6;--text:#F8FAFC;--muted:#A1AABD}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
  #wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px}
  header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  header b{color:var(--text);font-variant-numeric:tabular-nums}
  .sizes{display:flex;gap:8px;justify-content:center}
  .sizes button{padding:8px 14px;border-radius:999px;border:1px solid rgba(139,92,246,.4);background:transparent;color:var(--muted);font-size:12px;font-weight:600}
  .sizes button.active{background:linear-gradient(135deg,rgba(255,122,24,.25),rgba(139,92,246,.25));border-color:var(--accent);color:var(--text)}
  #grid{flex:1;display:grid;gap:8px;margin:0 auto;width:100%;max-width:520px;align-content:center}
  .card{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid rgba(139,92,246,.28);background:linear-gradient(160deg,#141b2e,#101526);
    display:grid;place-items:center;font-size:clamp(20px,7vw,34px);cursor:pointer;transition:transform .16s ease,background .2s ease,border-color .2s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .card:active{transform:scale(.95)}
  .card .symbol{opacity:0;transform:scale(.6);transition:opacity .18s ease,transform .18s ease}
  .card.flipped{border-color:rgba(34,211,238,.7);background:linear-gradient(160deg,#1b2740,#131b2e);box-shadow:0 0 24px rgba(34,211,238,.22)}
  .card.flipped .symbol{opacity:1;transform:scale(1)}
  .card.matched{border-color:rgba(34,197,94,.8);background:linear-gradient(160deg,rgba(34,197,94,.18),rgba(16,21,38,.9));cursor:default}
  .card.matched .symbol{opacity:1;transform:scale(1)}
  #status{text-align:center;font-size:14px;color:var(--muted);min-height:22px}
  #status strong{color:var(--cyan)}
  .actions{display:flex;gap:10px;justify-content:center;padding-bottom:8px}
  .actions button{padding:12px 22px;border:0;border-radius:14px;font-weight:700;color:#0b0f18;background:linear-gradient(135deg,var(--accent),#ffb35c)}
  .actions button.ghost{background:transparent;color:var(--muted);border:1px solid rgba(161,170,189,.35)}
</style>
</head>
<body>
<div id="wrap">
  <header><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0:00</b></span><span>Pairs <b id="pairs">0/8</b></span></header>
  <div class="sizes" id="sizes">
    <button data-size="4" class="active">4 × 4</button>
    <button data-size="5">5 × 4</button>
    <button data-size="6">6 × 6</button>
  </div>
  <div id="grid" role="grid" aria-label="Memory game board"></div>
  <div id="status">Find every pair.</div>
  <div class="actions">
    <button id="restart">New game</button>
  </div>
</div>
<script>
(() => {
  "use strict";
  const SYMBOLS = ["🚀","🌌","⚡","🎮","🔥","💎","🎧","🪐","🛸","🧊","🌙","⭐","🍀","🎯","🧩","🕹️","🌀","👾"];
  const grid = document.getElementById("grid");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("time");
  const pairsEl = document.getElementById("pairs");
  const statusEl = document.getElementById("status");
  const sizesEl = document.getElementById("sizes");

  let cols = 4, rows = 4, deck = [], first = null, locked = false, moves = 0, matched = 0, startedAt = null, timer = null, paused = false;

  function pairsFor(c, r) { return (c * r) / 2; }

  function layout() {
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.maxWidth = cols >= 6 ? "520px" : "440px";
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    startedAt = Date.now();
    timer = setInterval(() => {
      if (paused) return;
      const seconds = Math.floor((Date.now() - startedAt) / 1000);
      timeEl.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }, 250);
  }

  function newGame() {
    const total = cols * rows;
    const needed = SYMBOLS.slice(0, pairsFor(cols, rows));
    deck = shuffle([...needed, ...needed]);
    first = null; locked = false; moves = 0; matched = 0; paused = false;
    movesEl.textContent = "0";
    timeEl.textContent = "0:00";
    pairsEl.textContent = `0/${pairsFor(cols, rows)}`;
    statusEl.textContent = "Find every pair.";
    grid.innerHTML = "";
    layout();
    deck.forEach((symbol) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.setAttribute("aria-label", "Hidden card");
      card.dataset.symbol = symbol;
      const span = document.createElement("span");
      span.className = "symbol";
      span.textContent = symbol;
      card.appendChild(span);
      card.addEventListener("click", () => flip(card));
      grid.appendChild(card);
    });
    startTimer();
  }

  function flip(card) {
    if (locked || card.classList.contains("flipped") || card.classList.contains("matched")) return;
    card.classList.add("flipped");
    card.setAttribute("aria-label", card.dataset.symbol);
    if (!first) { first = card; return; }
    moves += 1;
    movesEl.textContent = String(moves);
    if (first.dataset.symbol === card.dataset.symbol) {
      first.classList.add("matched"); card.classList.add("matched");
      first.disabled = true; card.disabled = true;
      first = null;
      matched += 1;
      pairsEl.textContent = `${matched}/${pairsFor(cols, rows)}`;
      if (matched === pairsFor(cols, rows)) {
        if (timer) clearInterval(timer);
        statusEl.innerHTML = `Cleared in <strong>${moves}</strong> moves and <strong>${timeEl.textContent}</strong>. Nicely done.`;
      }
    } else {
      locked = true;
      const a = first, b = card;
      first = null;
      setTimeout(() => {
        a.classList.remove("flipped"); b.classList.remove("flipped");
        a.setAttribute("aria-label", "Hidden card"); b.setAttribute("aria-label", "Hidden card");
        locked = false;
      }, 650);
    }
  }

  sizesEl.addEventListener("click", (event) => {
    const size = Number(event.target.getAttribute("data-size"));
    if (!size) return;
    cols = size;
    rows = size === 5 ? 4 : size;
    [...sizesEl.children].forEach((btn) => btn.classList.toggle("active", btn === event.target));
    newGame();
  });

  document.getElementById("restart").addEventListener("click", newGame);

  document.addEventListener("visibilitychange", () => { paused = document.hidden; });
  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "playnix:pause") paused = true;
    if (event.data && event.data.type === "playnix:resume") paused = false;
  });

  newGame();
})();
</script>
</body>
</html>
