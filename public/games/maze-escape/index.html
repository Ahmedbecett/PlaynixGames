<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090B14">
<title>Maze Escape</title>
<style>
  :root { --bg:#090B14; --card:#171E30; --accent:#FF7A18; --cyan:#22D3EE; --violet:#8B5CF6; --text:#F8FAFC; --muted:#A1AABD; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; padding:10px 16px; font-size:12px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); }
  header b { color:var(--text); font-variant-numeric:tabular-nums; font-size:15px; }
  #stage { flex:1; position:relative; display:grid; place-items:center; padding:0 8px; }
  canvas { display:block; border-radius:18px; background:radial-gradient(circle at 50% 40%,#141b2e,#090B14 75%);
    box-shadow:0 0 0 1px rgba(139,92,246,.25),0 18px 60px rgba(0,0,0,.6); touch-action:none; }
  #pad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px); gap:8px;
    justify-content:center; padding:10px 10px 18px; }
  #pad button { border:1px solid rgba(139,92,246,.35); background:rgba(23,30,48,.92); color:var(--text);
    border-radius:14px; font-size:19px; }
  #pad button:active { background:rgba(255,122,24,.25); border-color:var(--accent); }
  #overlay { position:absolute; inset:0; display:grid; place-items:center; background:rgba(9,11,20,.86); backdrop-filter:blur(6px); }
  .panel { text-align:center; padding:24px 20px; border-radius:22px; background:var(--card); border:1px solid rgba(34,211,238,.25); max-width:320px; }
  .panel h1 { margin:0 0 6px; font-size:23px; background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .panel p { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 16px; }
  .panel button { width:100%; padding:13px; border:0; border-radius:14px; font-weight:800; font-size:15px; color:#0b0f18;
    background:linear-gradient(135deg,var(--accent),#ffb35c); box-shadow:0 10px 30px rgba(255,122,24,.35); }
  .hidden { display:none !important; }
  @media (min-width:760px) and (pointer:fine) { #pad { opacity:.7; } }
</style>
</head>
<body>
<div id="wrap">
  <header><span>Level <b id="level">1</b></span><span>Keys <b id="keys">0/3</b></span><span>Time <b id="time">0.0s</b></span><span>Best <b id="best">0</b></span></header>
  <div id="stage">
    <canvas id="game" width="600" height="600" aria-label="Maze Escape"></canvas>
    <div id="overlay">
      <div class="panel">
        <h1>Maze Escape</h1>
        <p id="hint">Collect all three keys, then reach the glowing door. Every level you escape is a bigger maze.</p>
        <button id="startBtn">Start game</button>
      </div>
    </div>
  </div>
  <div id="pad">
    <span></span><button data-dir="up" aria-label="Up">▲</button><span></span>
    <button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button>
  </div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const levelEl = document.getElementById("level");
  const keysEl = document.getElementById("keys");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const hintEl = document.getElementById("hint");
  const KEY = "playnix.maze-escape.best";

  let maze, size, cellPx, canvasPx, player, target, keys, exitCell, level, collected, started, running, paused;
  let elapsed, best, dirty;

  best = Number(localStorage.getItem(KEY) || 0);
  bestEl.textContent = String(best);

  function idx(x, y) { return y * size + x; }

  function generate(step) {
    const n = Math.min(31, 13 + step * 4);
    size = n;
    maze = new Uint8Array(n * n).fill(1); // 1 = wall
    const stack = [[1, 1]];
    maze[idx(1, 1)] = 0;
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => Math.random() - 0.5);
      let moved = false;
      for (const [dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        if (nx <= 0 || ny <= 0 || nx >= n - 1 || ny >= n - 1) continue;
        if (maze[idx(nx, ny)] === 0) continue;
        maze[idx(cx + dx / 2, cy + dy / 2)] = 0;
        maze[idx(nx, ny)] = 0;
        stack.push([nx, ny]);
        moved = true;
        break;
      }
      if (!moved) stack.pop();
    }
    // a few extra openings so the maze has loops (more fun, less dead-ending)
    for (let i = 0; i < step + 3; i += 1) {
      const x = 1 + 2 * Math.floor(Math.random() * ((n - 1) / 2 | 0));
      const y = 1 + 2 * Math.floor(Math.random() * ((n - 1) / 2 | 0));
      if (x > 0 && y > 0 && x < n - 1 && y < n - 1) maze[idx(x, y)] = 0;
    }
    return n;
  }

  function openCells() {
    const list = [];
    for (let y = 1; y < size - 1; y += 1) for (let x = 1; x < size - 1; x += 1) if (!maze[idx(x, y)]) list.push({ x, y });
    return list;
  }

  function farCells(from, cells) {
    return cells
      .map((c) => ({ ...c, d: Math.abs(c.x - from.x) + Math.abs(c.y - from.y) }))
      .sort((a, b) => b.d - a.d)
      .filter((c) => c.d > 4);
  }

  function newLevel(step) {
    generate(step);
    const cells = openCells();
    player = { x: 1, y: 1 };
    const far = farCells(player, cells);
    exitCell = far.length ? far[0] : cells[cells.length - 1];

    // Always three keys: prefer distant cells, then fall back to any open cell.
    const pool = far
      .concat(cells.slice().sort(() => Math.random() - 0.5))
      .filter((c) => !(c.x === exitCell.x && c.y === exitCell.y) && !(c.x === player.x && c.y === player.y));
    keys = [];
    for (const candidate of pool) {
      if (keys.length >= 3) break;
      if (keys.some((k) => k.x === candidate.x && k.y === candidate.y)) continue;
      keys.push({ x: candidate.x, y: candidate.y });
    }
    collected = 0;
    target = { x: player.x, y: player.y };
    keysEl.textContent = "0/3";
    levelEl.textContent = String(step + 1);
    resize();
  }

  function resize() {
    if (!size) return;
    const stage = canvas.parentElement;
    const px = Math.max(240, Math.floor(Math.min(stage.clientWidth - 20, stage.clientHeight - 16, 620)));
    canvasPx = px;
    cellPx = px / size;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = px + "px";
    canvas.style.height = px + "px";
    canvas.width = Math.floor(px * dpr);
    canvas.height = Math.floor(px * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true;
  }

  function draw() {
    if (!maze || !cellPx) return;
    ctx.clearRect(0, 0, canvasPx, canvasPx);

    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        if (!maze[idx(x, y)]) continue;
        ctx.fillStyle = "#151d31";
        ctx.fillRect(x * cellPx, y * cellPx, cellPx + 1, cellPx + 1);
      }
    }

    ctx.strokeStyle = "rgba(139,92,246,.14)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= size; i += 1) {
      ctx.beginPath(); ctx.moveTo(i * cellPx, 0); ctx.lineTo(i * cellPx, canvasPx); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cellPx); ctx.lineTo(canvasPx, i * cellPx); ctx.stroke();
    }

    // keys
    keys.forEach((k) => {
      const cx = (k.x + 0.5) * cellPx, cy = (k.y + 0.5) * cellPx;
      const pulse = 1 + Math.sin(performance.now() / 260) * 0.12;
      ctx.fillStyle = "#FACC15";
      ctx.shadowColor = "rgba(250,204,21,.8)";
      ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(cx, cy, cellPx * 0.26 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#3b2b03";
      ctx.fillRect(cx - cellPx * 0.04, cy - cellPx * 0.12, cellPx * 0.08, cellPx * 0.26);
    });

    // exit
    if (exitCell) {
      const open = collected >= 3;
      const cx = (exitCell.x + 0.5) * cellPx, cy = (exitCell.y + 0.5) * cellPx;
      ctx.fillStyle = open ? "#22D3EE" : "rgba(34,211,238,.22)";
      ctx.shadowColor = "rgba(34,211,238,.9)";
      ctx.shadowBlur = open ? 22 : 8;
      const s = cellPx * 0.62;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx - s / 2, cy - s / 2, s, s, cellPx * 0.16);
      else ctx.rect(cx - s / 2, cy - s / 2, s, s);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (!open) {
        ctx.fillStyle = "#F8FAFC";
        ctx.font = "700 " + Math.round(cellPx * 0.5) + "px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🔒", cx, cy + 1);
      }
    }

    // player
    const px = (player.x + 0.5) * cellPx, py = (player.y + 0.5) * cellPx;
    ctx.fillStyle = "#FF7A18";
    ctx.shadowColor = "rgba(255,122,24,.9)";
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(px, py, cellPx * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (paused && running) {
      ctx.fillStyle = "rgba(9,11,20,.66)";
      ctx.fillRect(0, 0, canvasPx, canvasPx);
      ctx.fillStyle = "#F8FAFC";
      ctx.font = "600 " + Math.round(canvasPx / 14) + "px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Paused", canvasPx / 2, canvasPx / 2);
    }
  }

  function tryMove(dx, dy) {
    if (!running || paused) return;
    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || ny < 0 || nx >= size || ny >= size) return;
    if (maze[idx(nx, ny)]) return;
    player.x = nx;
    player.y = ny;

    const key = keys.findIndex((k) => k.x === nx && k.y === ny);
    if (key >= 0) {
      keys.splice(key, 1);
      collected += 1;
      keysEl.textContent = collected + "/3";
    }
    if (collected >= 3 && nx === exitCell.x && ny === exitCell.y) nextLevel();
    draw();
  }

  function nextLevel() {
    level += 1;
    newLevel(level - 1);
    draw();
  }

  function finish() {
    running = false;
    if (scoreNow() > best) { best = scoreNow(); localStorage.setItem(KEY, String(best)); bestEl.textContent = String(best); }
    overlay.classList.remove("hidden");
    hintEl.textContent = "You escaped " + (level - 1) + (level - 1 === 1 ? " maze" : " mazes") + " in " + elapsed.toFixed(1) + "s — score " + best + ".";
    startBtn.textContent = "Play again";
  }

  function scoreNow() { return Math.round((level - 1) * 500 + Math.max(0, 600 - elapsed * 4)); }

  function start() {
    level = 1; elapsed = 0; started = true; running = true; paused = false;
    overlay.classList.add("hidden");
    newLevel(0);
    draw();
    requestAnimationFrame(tick);
  }

  let lastTick = 0;
  function tick(now) {
    if (!running) return;
    if (!paused) {
      if (lastTick && started) {
        elapsed += (now - lastTick) / 1000;
        timeEl.textContent = elapsed.toFixed(1) + "s";
        if (elapsed > 240) { finish(); return; }
      }
      lastTick = now;
      draw();
    } else {
      lastTick = now;
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener("keydown", (event) => {
    const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
    if (event.code === "Space") { event.preventDefault(); if (!running) start(); else { paused = !paused; draw(); } return; }
    const next = map[event.code];
    if (next) { event.preventDefault(); tryMove(next[0], next[1]); }
  });

  document.getElementById("pad").addEventListener("click", (event) => {
    const dir = event.target.getAttribute("data-dir");
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    if (dir) tryMove(map[dir][0], map[dir][1]);
  });

  let swipe = null;
  canvas.addEventListener("touchstart", (event) => {
    const t = event.changedTouches[0];
    swipe = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", (event) => {
    if (!swipe) return;
    const t = event.changedTouches[0];
    const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0);
    else tryMove(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  startBtn.addEventListener("click", start);
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) { paused = true; draw(); } });
  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type === "playnix:pause" && running) { paused = true; draw(); }
    if (data.type === "playnix:resume" && running) { paused = false; lastTick = performance.now(); }
  });
  window.addEventListener("resize", resize);

  running = false;
  level = 1;
  elapsed = 0;
  generate(0);
  const initial = openCells();
  player = { x: 1, y: 1 };
  const far = farCells(player, initial);
  exitCell = far.length ? far[0] : initial[0];
  keys = far.slice(1, 4).map((c) => ({ x: c.x, y: c.y }));
  collected = 0;
  resize();
})();
</script>
</body>
</html>
