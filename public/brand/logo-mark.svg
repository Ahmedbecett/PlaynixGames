<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Playnix logo">
  <defs>
    <linearGradient id="pn-shell" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <linearGradient id="pn-bar" x1="34" y1="30" x2="52" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB35C"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <linearGradient id="pn-play" x1="54" y1="38" x2="96" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="pn-glow" x="-50%" y="-50%" width="200%" height="200%">
